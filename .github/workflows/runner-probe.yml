name: Hosted runner probe

# Isolate runner startup from checkout, dependencies, build and publication.
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/runner-probe.yml"]
  workflow_dispatch:

permissions: {}

jobs:
  runner-probe:
    name: Probe (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Confirm runner startup
        shell: bash
        env:
          PROBE_LABEL: ${{ matrix.runner }}
        run: |
          echo "Requested ${PROBE_LABEL}; runner ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH}) started successfully"
          uname -a
          cat /etc/os-release
